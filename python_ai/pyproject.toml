[project]
name = "mscw-opening-ai"
version = "0.1.0"
description = "Python ETL, simulator, RL, and guide generator for MapleStory Classic World opening-route AI."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "tqdm>=4.66",
  "gymnasium>=0.29",
  "torch>=2.2",
]

[project.optional-dependencies]
web = ["playwright>=1.44"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
